name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - run: make check

  windows-wsl:
    runs-on: windows-latest
    steps:
      # A Windows-side checkout with autocrlf is the case .gitattributes has to survive.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - name: Import an Ubuntu distribution into WSL
        shell: pwsh
        run: |
          curl.exe -fsSL -o rootfs.tar.gz https://cloud-images.ubuntu.com/wsl/releases/24.04/current/ubuntu-noble-wsl-amd64-wsl.rootfs.tar.gz
          wsl --import ci C:\wsl-ci rootfs.tar.gz --version 1
          Remove-Item rootfs.tar.gz
      - name: Install tools
        shell: pwsh
        run: wsl -d ci -u root -- bash -c "apt-get update -qq && apt-get install -y -qq git make python3 shellcheck && git config --global --add safe.directory '*'"
      - name: make check
        shell: pwsh
        run: wsl -d ci -u root --cd "$env:GITHUB_WORKSPACE" -- make check
